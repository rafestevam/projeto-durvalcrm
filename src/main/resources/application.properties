# ---------------------------------------------------------------------------
# DurvalCRM — Quarkus application configuration
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Datasource (PostgreSQL)
# Override these values via environment variables or .env in production.
# ---------------------------------------------------------------------------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:durvalcrm}
quarkus.datasource.password=${DB_PASSWORD:durvalcrm}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/durvalcrm}

# ---------------------------------------------------------------------------
# Hibernate ORM
# In production, use 'validate' (Flyway owns the schema).
# In dev mode 'none' is safe since Flyway runs migrations on startup.
# ---------------------------------------------------------------------------
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false

# ---------------------------------------------------------------------------
# Flyway — schema migrations
# ---------------------------------------------------------------------------
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration

# ---------------------------------------------------------------------------
# Dev mode overrides (active only when running `mvn quarkus:dev`)
# ---------------------------------------------------------------------------
%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/durvalcrm_dev}

# ---------------------------------------------------------------------------
# Test profile overrides (active during `mvn test`)
# ---------------------------------------------------------------------------
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:durvalcrm_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.flyway.migrate-at-start=false
